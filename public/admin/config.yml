# Website editor (Sveltia CMS). Open /admin/ on the live site.
# Every save is a commit to GitHub; the site rebuilds in about a minute.
# Docs: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: mamoonrkhan/issv-website   # <owner>/<repo>: change if the repo moves to a school account
  branch: main
  commit_messages:
    create: 'Add {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'
  # For "Sign in with GitHub" (instead of a token), deploy the free
  # sveltia-cms-auth worker and put its URL here:
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

media_folder: src/assets/uploads
public_folder: /src/assets/uploads

# Images are converted to WebP on upload; the build also makes AVIF/WebP sizes and strips location data.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

collections:
  # ------------------------------------------------------------------
  - name: announcements
    label: Announcements
    label_singular: Announcement
    description: Shows on the Home page. Turn on “Top banner” for urgent news. Expired posts hide by themselves.
    folder: src/content/announcements
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    summary: '{{title}} · {{showFrom}} → {{hideAfter}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: body, label: Message, widget: text, hint: One or two short sentences. }
      - { name: date, label: Posted on, widget: datetime, format: YYYY-MM-DD, time_format: false, default: '{{now}}' }
      - { name: showFrom, label: Show from, widget: datetime, format: YYYY-MM-DD, time_format: false, default: '{{now}}' }
      - { name: hideAfter, label: Hide after, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: Last day it shows. Leave empty to keep it up. }
      - { name: banner, label: Show as top banner, widget: boolean, default: false, hint: The green bar above every page. Use for urgent news. }

  # ------------------------------------------------------------------
  - name: calendar
    label: Calendar
    files:
      - name: calendar
        label: School calendar
        file: src/data/calendar.json
        format: json
        description: Changing a Sunday here updates the Calendar page, the “This Sunday” card and families’ subscribed calendars.
        fields:
          - { name: schoolYear, label: School year, widget: string }
          - { name: hijriYear, label: Hijri year, widget: string }
          - { name: startTime, label: Class starts (24h), widget: string, pattern: ['^\d{2}:\d{2}$', 'Use HH:MM'] }
          - { name: endTime, label: Class ends (24h), widget: string, pattern: ['^\d{2}:\d{2}$', 'Use HH:MM'] }
          - name: sundays
            label: Sundays
            label_singular: Sunday
            widget: list
            summary: '{{date}} · {{status}} {{note}}'
            fields:
              - { name: date, label: Sunday, widget: datetime, format: YYYY-MM-DD, time_format: false }
              - name: status
                label: Status
                widget: select
                options:
                  - { label: In session, value: in-session }
                  - { label: Virtual (Zoom), value: virtual }
                  - { label: Possible virtual, value: possible-virtual }
                  - { label: No school, value: no-school }
              - { name: note, label: Note shown to parents, widget: string, required: false, hint: 'For “No school”, the holiday name (e.g. Thanksgiving).' }
          - name: events
            label: Events & deadlines
            label_singular: Event
            widget: list
            summary: '{{date}} · {{title}}'
            fields:
              - { name: date, label: Date, widget: datetime, format: YYYY-MM-DD, time_format: false }
              - { name: end, label: End date (for multi-day events), widget: datetime, format: YYYY-MM-DD, time_format: false, required: false }
              - { name: title, label: Title, widget: string }

  # ------------------------------------------------------------------
  - name: sunday
    label: This Sunday
    files:
      - name: override
        label: Emergency override
        file: src/data/sunday.json
        format: json
        description: Use for weather, closures or last-minute changes. Turn it off again afterwards.
        fields:
          - { name: enabled, label: Override the “This Sunday” card, widget: boolean, default: false }
          - { name: date, label: For Sunday, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: Leave empty to apply to whichever Sunday is next. }
          - name: status
            label: Status
            widget: select
            options:
              - { label: In session, value: in-session }
              - { label: Virtual (Zoom), value: virtual }
              - { label: No school, value: no-school }
          - { name: title, label: Headline, widget: string, required: false, hint: 'e.g. “School closed: power outage”' }
          - { name: message, label: Details, widget: text, required: false }

  # ------------------------------------------------------------------
  - name: settings
    label: Settings
    files:
      - name: payment
        label: Tuition & payment
        file: src/data/payment.json
        format: json
        fields:
          - { name: tuitionPerChild, label: Tuition per child ($), widget: number, value_type: int, min: 0 }
          - { name: maxChildren, label: Max children in estimator, widget: number, value_type: int, min: 1 }
          - { name: secondInstallmentDue, label: 2nd installment due, widget: string, hint: e.g. Jan 10 }
          - { name: currentFamilies, label: Pre-registration (current families), widget: string }
          - { name: newFamilies, label: Registration (new families), widget: string }
          - { name: registrationCloses, label: Registration closes, widget: string }
          - { name: zelleEmail, label: Zelle email or phone, widget: string }
          - { name: zelleName, label: Name exactly as shown in Zelle, widget: string }
          - { name: zelleQr, label: Zelle QR code image, widget: image, required: false, media_folder: /src/assets/uploads, public_folder: /src/assets/uploads }
          - { name: memoFormat, label: Zelle memo format, widget: string }
          - { name: checkPayee, label: Checks payable to, widget: string }
          - { name: checkMemo, label: Check memo, widget: string }
          - { name: checkWhere, label: Where to hand in checks, widget: string }
          - { name: mailingAddress, label: Mailing address for checks, widget: string, required: false }
      - name: site
        label: Contact, links & PDFs
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: School name, widget: string }
          - { name: shortName, label: Short name, widget: string }
          - { name: tagline, label: Home headline, widget: string }
          - { name: lead, label: Home lead sentence, widget: text }
          - { name: previewNotice, label: Show “proposal preview” notice (and hide from search engines), widget: boolean, default: true }
          - { name: location, label: Location, widget: string }
          - { name: address, label: Street address, widget: string, required: false }
          - { name: parkingNotes, label: Parking notes, widget: text, required: false }
          - { name: hours, label: Hours, widget: string }
          - { name: emailGeneral, label: General email, widget: string }
          - { name: emailRegistration, label: Registration email, widget: string }
          - { name: absenceFormUrl, label: Absence form link (Google Form), widget: string }
          - { name: donationUrl, label: Donation link, widget: string, required: false, hint: Leave empty to send people an email instead. }
          - { name: volunteerSignupUrl, label: Volunteer sign-up link, widget: string, required: false }
          - { name: taxId, label: Tax ID (EIN), widget: string }
          - { name: heroImage, label: Home page photo, widget: image, required: false, media_folder: /src/assets/photos, public_folder: /src/assets/photos, hint: 'Use photos without children in them (the building, the sign).' }
          - { name: heroImageAlt, label: Home photo description, widget: string, required: false }
          - { name: heroImageCredit, label: Photo credit, widget: string, required: false, hint: Required for photos with a Creative Commons license. }
          - { name: heroImageCreditUrl, label: Photo credit link, widget: string, required: false }
          - { name: pdfCalendar, label: Calendar PDF, widget: file, required: false, media_folder: /public/docs, public_folder: /docs }
          - { name: pdfCurriculum, label: Curriculum PDF, widget: file, required: false, media_folder: /public/docs, public_folder: /docs }
          - { name: pdfGuidelines, label: Parent guidelines PDF, widget: file, required: false, media_folder: /public/docs, public_folder: /docs }

  # ------------------------------------------------------------------
  - name: pages
    label: Page text
    files:
      - name: handbook
        label: Parent handbook
        file: src/data/handbook.json
        format: json
        fields:
          - { name: lead, label: Intro line, widget: string }
          - name: sections
            label: Sections
            label_singular: Section
            widget: list
            summary: '{{title}}'
            fields:
              - { name: id, label: Link name, widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes'], hint: 'Used in links like /families/#arrival. Don’t change existing ones.' }
              - { name: title, label: Title, widget: string }
              - { name: items, label: Rules, widget: list, field: { name: item, label: Rule, widget: text } }
      - name: curriculum
        label: Curriculum
        file: src/data/curriculum.json
        format: json
        fields:
          - { name: lead, label: Intro line, widget: string }
          - name: grades
            label: Grades
            label_singular: Grade
            widget: list
            summary: '{{title}}'
            fields:
              - { name: id, label: Link name, widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes'] }
              - { name: label, label: Tab label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: quran, label: Quran, widget: text }
              - { name: memorize, label: Memorize, widget: text }
              - { name: studies, label: Islamic studies, widget: text }
          - name: schedule
            label: A Sunday at school
            widget: list
            summary: '{{time}} · {{what}}'
            fields: [{ name: time, label: Time, widget: string }, { name: what, label: What, widget: string }]
          - name: milestones
            label: Milestones
            widget: list
            summary: '{{when}} · {{what}}'
            fields: [{ name: when, label: When, widget: string }, { name: what, label: What, widget: string }]
      - name: faq
        label: New family FAQs
        file: src/data/faq.json
        format: json
        fields:
          - name: items
            label: Questions
            label_singular: Question
            widget: list
            summary: '{{q}}'
            fields: [{ name: q, label: Question, widget: string }, { name: a, label: Answer, widget: text }]
